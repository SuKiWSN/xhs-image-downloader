name: Release

# 推送 v1.2.3 这样的标签时：检查版本号 → 跑单元测试 → 打包插件 → 发布到 GitHub Releases
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查版本号
        run: |
          version="v$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json 里的版本是 $version，和标签 $GITHUB_REF_NAME 不一致"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: 打包插件
        # .gitattributes 里标了 export-ignore 的测试文件不会进安装包；文件直接放在 zip 根目录，
        # Windows「全部解压缩」后选中解压出的文件夹就能加载
        run: |
          git archive --format=zip -o "xhs-image-downloader-$GITHUB_REF_NAME.zip" HEAD
          unzip -l "xhs-image-downloader-$GITHUB_REF_NAME.zip"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSION}}/$GITHUB_REF_NAME/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" "xhs-image-downloader-$GITHUB_REF_NAME.zip" \
            --title "小红书图片下载 $GITHUB_REF_NAME" --notes-file notes.md
