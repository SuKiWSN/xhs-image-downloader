<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小红书图片下载</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="../icons/icon48.png" alt="" width="28" height="28" />
      <div class="head-text">
        <h1>小红书图片下载</h1>
        <p class="sub">点笔记下方的「下载」，全部图片会存进以标题命名的文件夹</p>
      </div>
      <span class="saved" id="saved" aria-live="polite"></span>
    </header>

    <main>
      <section class="group">
        <h2>图片格式</h2>
        <div class="segmented" role="radiogroup" aria-label="图片格式">
          <label><input type="radio" name="imageFormat" value="original" /><span>原图</span></label>
          <label><input type="radio" name="imageFormat" value="jpg" /><span>JPG</span></label>
          <label><input type="radio" name="imageFormat" value="png" /><span>PNG</span></label>
        </div>
        <p class="help" id="formatHelp"></p>
      </section>

      <section class="group">
        <label class="switch-row">
          <span>
            <span class="row-title">视频笔记下载视频</span>
            <span class="help">关闭后视频笔记只下载封面</span>
          </span>
          <input type="checkbox" name="downloadVideo" class="switch" />
        </label>
        <label class="switch-row">
          <span>
            <span class="row-title">实况图同时下载动态视频</span>
            <span class="help">Live Photo 会多存一个 _实况.mp4</span>
          </span>
          <input type="checkbox" name="downloadLive" class="switch" />
        </label>
      </section>

      <section class="group">
        <h2>保存位置</h2>
        <label class="field">
          <span class="help">下载目录里的上级文件夹（可留空，多级用 / 分隔）</span>
          <input type="text" name="subDir" placeholder="留空 = 直接放在下载目录" maxlength="80" spellcheck="false" />
        </label>
        <p class="path" id="pathPreview"></p>
        <p class="path-warn" id="pathWarn" hidden>
          插件只能存到浏览器的下载目录里，盘符等绝对路径会被忽略。想存到别的盘或文件夹，请<a
            href="#" class="open-download-settings">修改浏览器的下载位置</a>。
        </p>
      </section>
    </main>

    <footer class="foot">
      <p>
        如果浏览器开启了「下载前询问每个文件的保存位置」，每张图片都会弹出保存框，建议<a
          href="#" class="open-download-settings">去关闭</a>。
      </p>
    </footer>

    <script src="../src/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
